name: Deploy on S3

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-24.04
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Publish hashed assets to S3
        run: >
          aws s3 sync dist/_astro/ s3://be-oi.be/_astro/
          --cache-control "public,max-age=31536000,immutable"

      - name: Publish site to S3
        run: >
          aws s3 sync dist/ s3://be-oi.be/
          --delete
          --exclude "_astro/*"
          --cache-control "public,max-age=300,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id E1HFWB6I0WMJ8D \
            --paths "/" "/fr/*" "/nl/*" "/en/*" "/sitemap-index.xml" "/sitemap-0.xml" "/robots.txt"
